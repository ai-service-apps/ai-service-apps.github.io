# Apple Inside Apps — Netlify deployment.
# Publish only static HTML, keep webhook source outside public output.
[build]
  command = "mkdir -p dist && cp ./*.html dist/ && cp ./anypay-verification.txt ./catalog-fallback.json ./_redirects dist/"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/owner-pilot"
  to = "https://cmcfwkfhyxfljpowbkpj.supabase.co/functions/v1/apps-owner-pilot"
  status = 200
  force = true

[[redirects]]
  from = "/api/payment-health"
  to = "https://cmcfwkfhyxfljpowbkpj.supabase.co/functions/v1/apps-anypay-api-check"
  status = 200
  force = true

[[redirects]]
  from = "/api/checkout"
  to = "https://cmcfwkfhyxfljpowbkpj.supabase.co/functions/v1/apps-checkout"
  status = 200
  force = true

[[redirects]]
  from = "/api/catalog"
  to = "https://cmcfwkfhyxfljpowbkpj.supabase.co/functions/v1/apps-orders"
  status = 200
  force = true

[[redirects]]
  from = "/api/anypay"
  to = "https://cmcfwkfhyxfljpowbkpj.supabase.co/functions/v1/ap"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
